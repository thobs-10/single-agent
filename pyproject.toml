[project]
name = "single-agent"
version = "0.1.0"
description = "Local-first Gmail newsletter summarizer agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"loguru>=0.7.3",
	"pydantic>=2.8.0",
	"pydantic-settings>=2.4.0",
	"python-dotenv>=1.0.1",
]

[project.scripts]
single-agent = "main:main"

[dependency-groups]
dev = [
	"mypy>=1.11.0",
	"pytest>=8.3.0",
	"pytest-cov>=5.0.0",
	"ruff>=0.5.7",
]
